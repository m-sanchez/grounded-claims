name: release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
      publish_existing_tag:
        description: Publish this existing tag (e.g. v2.0.1) instead of bumping
        type: string
        default: ''
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.publish_existing_tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g npm@latest
      - name: the tag must match package.json
        if: github.event_name == 'push' || inputs.publish_existing_tag
        env:
          TAG: ${{ inputs.publish_existing_tag || github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:offline
      - name: bump the version, push the release commit and tag
        if: github.event_name == 'workflow_dispatch' && !inputs.publish_existing_tag
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name "Miguel Sanchez"
          git config user.email "contact@miguelsanchez.co.uk"
          npm version "$BUMP" -m "Release %s"
          # A tag pushed with GITHUB_TOKEN starts no new run, so this job publishes it.
          git push --atomic origin HEAD "v$(node -p "require('./package.json').version")"
      - name: publish to npm unless this version is already there
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$name@$version is already on npm"
          else
            npm publish
          fi
      - name: create the GitHub release unless it exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          gh release view "$tag" > /dev/null 2>&1 || gh release create "$tag" --generate-notes --verify-tag
