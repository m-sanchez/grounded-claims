name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm pack
      - name: install proof
        run: |
          mkdir -p "$RUNNER_TEMP/scratch" && cd "$RUNNER_TEMP/scratch"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/m-sanchez-grounded-claims-*.tgz
          node -e "import('@m-sanchez/grounded-claims').then(m => { if (Object.keys(m).length === 0) throw new Error('empty module'); console.log('import ok'); })"
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 26
      - run: npm ci
      # The negative control comes first. Node has no network permission on
      # any release, so the old `node --permission` job would have passed
      # identically with the sandbox doing nothing; this step deliberately
      # attempts a connection and fails the build unless the trap denies it.
      - name: negative control - the trap must fire
        run: |
          node --import ./test/no-network.ts -e "
            import('node:net').then((net) => {
              try {
                net.connect(80, '127.0.0.1');
              } catch (err) {
                if (err.code !== 'ERR_NO_NETWORK') {
                  console.error('trap threw the wrong error:', err.code);
                  process.exit(1);
                }
                console.log('trap fired:', err.code);
                return;
              }
              console.error('a connection attempt escaped the trap');
              process.exit(1);
            });
          "
      - name: full suite under the network trap and no child processes
        run: npm run test:offline
